<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest">
<title>Light speckle texture for dark areas</title>
<filter id="n" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 0 0.82  0 0 0 0.9 -0.42"/>
</filter>
<rect width="100%" height="100%" filter="url(#n)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
